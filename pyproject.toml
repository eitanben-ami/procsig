[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procsig"
version = "0.1.0"
description = "Inspect local processes by PID or name and render signatures."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
  {name = "Eitan Ben-Ami"}
]
keywords = ["cli", "process", "inspection", "devtools", "python", "stdlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/eitanben-ami/procsig"
Homepage = "https://github.com/eitanben-ami/procsig"

[project.scripts]
procsig = "procsig:main"

[tool.setuptools]
py-modules = ["procsig"]

[tool.setuptools.packages.find]
where = ["."]
include = ["procsig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
